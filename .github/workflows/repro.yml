on:
  push:
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "10.0.1"
            fix: "false"
          - version: "10.0.2"
            fix: "false"
          - version: "10.0.3"
            fix: "false"
          - version: "10.0.4"
            fix: "false"
          - version: "10.0.5"
            fix: "false"
          - version: "10.0.6"
            fix: "false"
          - version: "10.0.7"
            fix: "false"
          - version: "10.0.8"
            fix: "false"
          - version: "10.0.8"
            fix: "true"

    name: "${{ matrix.version }} | ${{ matrix.fix == 'true' && 'Fixed' || 'Not Fixed' }}"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          path: effort

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          repository: zzzprojects/nmemory
          path: nmemory

      - name: Install .NET Runtime
        run: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --runtime dotnet --version ${{ matrix.version }} --install-dir ./.dotnet
          ./dotnet-install.sh --version 10.0.101 --install-dir ./.dotnet
          echo "$GITHUB_WORKSPACE/.dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$GITHUB_WORKSPACE/.dotnet" >> $GITHUB_ENV

      - name: .NET Info
        working-directory: effort/reproduction
        run: |
          which dotnet
          dotnet --info

      - name: Build
        working-directory: effort/reproduction
        run: dotnet build -c Debug -p:LockingFix=${{ matrix.fix }}

      - name: Test
        working-directory: effort/reproduction
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 50; $i++) {
            Write-Host "Run #$($i + 1)"
            
            dotnet run -c Debug --no-build

            if ($LASTEXITCODE -ne 0) {
              throw "Run #$($i + 1) failed with exit code $LASTEXITCODE"
            }
          }
